<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2430"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffa116"/>
      <stop offset="50%" stop-color="#ff5f56"/>
      <stop offset="100%" stop-color="#e36fee"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="380" fill="url(#bg)" rx="14"/>

  <!-- Top Title -->
  <text x="500" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#brandGrad)" letter-spacing="1">SWIFT COLLECTION ALGORITHMS</text>
  <text x="500" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#8b949e">Memory-Efficient Algorithms · Safe Indexing · Amortized O(1) Actor LRU Cache</text>

  <!-- Left: Sequence Operators -->
  <rect x="50" y="110" width="410" height="230" rx="10" fill="url(#cardGrad)" stroke="#ffa116" stroke-width="1.5"/>
  <circle cx="90" cy="145" r="16" fill="#ffa116" fill-opacity="0.15"/>
  <text x="90" y="151" text-anchor="middle" font-size="15">🧩</text>
  <text x="120" y="151" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Collection Primitives</text>

  <text x="80" y="190" font-family="monospace" font-size="12" fill="#38ef7d">• array[safe: index]</text>
  <text x="250" y="190" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Bounds-checked safety</text>

  <text x="80" y="225" font-family="monospace" font-size="12" fill="#00c6ff">• .chunked(into: size)</text>
  <text x="250" y="225" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Preallocated capacity partitions</text>

  <text x="80" y="260" font-family="monospace" font-size="12" fill="#e36fee">• .windows(ofSize: k)</text>
  <text x="250" y="260" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Contiguous sliding slices</text>

  <text x="80" y="295" font-family="monospace" font-size="12" fill="#ff5f56">• .uniqued()</text>
  <text x="250" y="295" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">O(N) order-preserving deduplication</text>

  <text x="80" y="325" font-family="monospace" font-size="12" fill="#ffa116">• .binarySearch(for: x)</text>
  <text x="250" y="325" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">O(log N) partitioning lookup</text>

  <!-- Right: LRU Cache Architecture -->
  <rect x="520" y="110" width="430" height="230" rx="10" fill="url(#cardGrad)" stroke="#ff5f56" stroke-width="1.5"/>
  <circle cx="560" cy="145" r="16" fill="#ff5f56" fill-opacity="0.15"/>
  <text x="560" y="151" text-anchor="middle" font-size="15">⚡️</text>
  <text x="590" y="151" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Actor LRUCache (O(1))</text>

  <!-- Doubly Linked Nodes Visualization -->
  <!-- MRU Head -->
  <rect x="550" y="180" width="90" height="50" rx="6" fill="#141820" stroke="#38ef7d" stroke-width="1.5"/>
  <text x="595" y="202" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38ef7d">HEAD</text>
  <text x="595" y="220" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">Most Recent</text>

  <!-- Double arrow -->
  <line x1="640" y1="205" x2="685" y2="205" stroke="#8b949e" stroke-width="2"/>
  <polygon points="685,205 678,200 678,210" fill="#8b949e"/>
  <polygon points="640,205 647,200 647,210" fill="#8b949e"/>

  <!-- Mid Node -->
  <rect x="690" y="180" width="80" height="50" rx="6" fill="#141820" stroke="#30363d"/>
  <text x="730" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0f6fc">Node B</text>

  <!-- Double arrow -->
  <line x1="770" y1="205" x2="815" y2="205" stroke="#8b949e" stroke-width="2"/>
  <polygon points="815,205 808,200 808,210" fill="#8b949e"/>
  <polygon points="770,205 777,200 777,210" fill="#8b949e"/>

  <!-- LRU Tail -->
  <rect x="820" y="180" width="90" height="50" rx="6" fill="#141820" stroke="#ff5f56" stroke-width="1.5"/>
  <text x="865" y="202" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ff5f56">TAIL</text>
  <text x="865" y="220" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">Evicts First</text>

  <!-- Hash index -->
  <rect x="550" y="255" width="360" height="60" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="730" y="280" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#00c6ff">Hash Map Index: [Key: NodeReference]</text>
  <text x="730" y="302" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Combined for O(1) lookup &amp; O(1) list node re-link</text>
</svg>
